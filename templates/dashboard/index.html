<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- DASHBOARD TEMPLATE — a grid of stat tiles that refresh on an interval.
     Modelled on the uqracing.com stat cards. Replace the TILES definition and
     the fetchMetrics() function. -->
<title>Dashboard Template</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#201b26; --surface:rgba(255,255,255,.024); --surface-2:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.12); --ink:#fff; --muted:rgba(255,255,255,.6);
    --accent:#d7df23; --purple:#5c13aa; --purple-deep:#3b1f70;
    --radius:16px; --pill:9999px; --shadow:0 18px 44px rgba(0,0,0,.3);
    --font:"Helvetica Neue",Helvetica,Arial,"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
  main{max-width:56rem;margin:0 auto;padding:2.75rem 1.25rem 4rem}
  header{display:flex;align-items:baseline;justify-content:space-between;
    gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}
  h1{font-size:1.9rem;font-weight:700;margin:0;letter-spacing:-.01em}
  .accent{color:var(--accent)}
  .updated{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
  .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
  .tile{display:flex;align-items:center;gap:1rem;
    background:linear-gradient(rgba(255,255,255,.09),var(--surface) 55%);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1.25rem}
  .icon{flex:none;width:64px;height:64px;border-radius:var(--radius);
    background:var(--surface-2);border:1px solid var(--line);
    display:grid;place-items:center}
  .icon svg{width:30px;height:30px;stroke:var(--accent);fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .stat .value{font-size:2.25rem;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums}
  .stat .label{color:var(--muted);font-size:.9rem;margin-top:.35rem}
</style>
</head>
<body>
<main>
  <header>
    <!-- TODO: dashboard title -->
    <h1>Dashboard <span class="accent">Template</span></h1>
    <span class="updated" id="updated">—</span>
  </header>
  <div class="grid" id="grid"></div>
</main>

<script>
  "use strict";

  // Inline SVG icons (stroked in --accent). Add your own; keep them 24x24 paths.
  const ICONS = {
    trophy: '<svg viewBox="0 0 24 24"><path d="M6 4h12v3a6 6 0 0 1-12 0V4Z"/><path d="M6 6H3v1a3 3 0 0 0 3 3M18 6h3v1a3 3 0 0 1-3 3M9 20h6M12 16v4"/></svg>',
    people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/></svg>',
    gauge:  '<svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1"/></svg>',
    bolt:   '<svg viewBox="0 0 24 24"><path d="M13 3 4 14h6l-1 7 9-11h-6l1-7Z"/></svg>',
  };

  // TODO: define your tiles. `key` matches what fetchMetrics() returns.
  const TILES = [
    { key: "position", icon: "trophy", label: "Championship" },
    { key: "members",  icon: "people", label: "Team Members" },
    { key: "topSpeed", icon: "gauge",  label: "Top Speed (km/h)" },
    { key: "power",    icon: "bolt",   label: "Peak Power (kW)" },
  ];

  // TODO: return an object keyed like your tiles. Fetch from an API, read a
  // file, compute — anything self-contained. Must not call external hosts if
  // this is served behind Funnel; same-origin fetches are fine.
  async function fetchMetrics() {
    // Placeholder demo values.
    return { position: "#1", members: 40, topSpeed: 112, power: 80 };
  }

  const grid = document.getElementById("grid");
  const nodes = TILES.map((t) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML =
      `<div class="icon">${ICONS[t.icon] || ""}</div>` +
      `<div class="stat"><div class="value">—</div><div class="label"></div></div>`;
    tile.querySelector(".label").textContent = t.label;
    grid.append(tile);
    return { t, value: tile.querySelector(".value") };
  });

  async function refresh() {
    let data = {};
    try { data = await fetchMetrics(); } catch (e) { /* keep last values */ }
    for (const n of nodes) {
      const v = data[n.t.key];
      if (v !== undefined && v !== null) n.value.textContent = v;
    }
    document.getElementById("updated").textContent =
      "Updated " + new Date().toLocaleTimeString();
  }

  refresh();
  setInterval(refresh, 15000); // TODO: tune the refresh interval
</script>
</body>
</html>
