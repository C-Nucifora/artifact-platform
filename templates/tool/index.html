<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TOOL TEMPLATE — a single interactive widget: input → action → result.
     Replace the title/meta, the input(s), and the compute() function. -->
<title>Tool Template</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#201b26; --surface:rgba(255,255,255,.024); --surface-2:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.12); --ink:#fff; --muted:rgba(255,255,255,.6);
    --accent:#d7df23; --purple:#5c13aa; --purple-deep:#3b1f70;
    --radius:16px; --pill:9999px; --shadow:0 18px 44px rgba(0,0,0,.3);
    --font:"Helvetica Neue",Helvetica,Arial,"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.75rem;padding:2.5rem 1.25rem}
  h1{font-size:2rem;font-weight:700;margin:0;text-align:center;letter-spacing:-.01em}
  .accent{color:var(--accent)}
  .sub{color:var(--muted);margin:-.75rem 0 0;text-align:center}
  .panel{width:100%;max-width:30rem;background:linear-gradient(rgba(255,255,255,.08),var(--surface));
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1.5rem;display:grid;gap:1rem}
  label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .field{display:grid;gap:.4rem}
  input,select{font:inherit;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{font:inherit;font-weight:700;border:0;border-radius:var(--pill);
    padding:.75rem 1.5rem;cursor:pointer;background:var(--purple);color:#fff}
  .btn:hover{background:#6a17c4}
  .btn:active{transform:translateY(1px)}
  .result{min-height:3.5rem;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:1rem;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;
    text-align:center;word-break:break-word}
  .result.empty{color:var(--muted);font-size:1rem;font-weight:400}
</style>
</head>
<body>
  <!-- TODO: title. Wrap the emphasis word in <span class="accent"> -->
  <h1>Tool <span class="accent">Template</span></h1>
  <p class="sub">Enter a value and run it.</p>

  <div class="panel">
    <div class="field">
      <!-- TODO: replace with your real input(s) -->
      <label for="input">Input</label>
      <input id="input" type="text" placeholder="Type something…" autocomplete="off">
    </div>
    <button class="btn" id="run">Run</button>
    <div class="result empty" id="result">Result appears here</div>
  </div>

<script>
  "use strict";

  // TODO: this is the only logic you need to change. Take the raw input,
  // return whatever should be displayed. Keep it pure and synchronous, or
  // make it async and await it below.
  function compute(value) {
    if (!value) return null;
    // Placeholder behaviour: character count. Replace with your tool.
    return `${value.length} characters`;
  }

  const input = document.getElementById("input");
  const result = document.getElementById("result");

  function run() {
    const out = compute(input.value.trim());
    if (out === null || out === undefined) {
      result.textContent = "Result appears here";
      result.classList.add("empty");
    } else {
      result.textContent = out;
      result.classList.remove("empty");
    }
  }

  document.getElementById("run").addEventListener("click", run);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
